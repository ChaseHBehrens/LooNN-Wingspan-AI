# Builds the terminal version (src/bin/terminal.rs) for Linux, macOS and Windows
# when a version tag (v*) is pushed, and attaches the binaries to that tag's
# release once every build has finished, creating the release if needed. Run by
# hand, it keeps the builds as workflow artifacts instead.
name: Build terminal version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Small, self-contained binaries: no debug info, and no Visual C++ runtime needed on Windows
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_STRIP: "true"
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Without the default `python` feature, so the binary doesn't need Python or PyTorch
      - name: Build
        run: cargo build --release --locked --no-default-features --features terminal --bin terminal --target ${{ matrix.target }}

      - name: Name the binary
        id: binary
        run: |
          file=loonn-terminal-${{ matrix.name }}
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            file=$file.exe
            cp target/${{ matrix.target }}/release/terminal.exe "$file"
          else
            cp target/${{ matrix.target }}/release/terminal "$file"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Keep as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: loonn-terminal-${{ matrix.name }}
          path: ${{ steps.binary.outputs.file }}

  # Publishes only after every build has succeeded, so no release is missing a binary
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
