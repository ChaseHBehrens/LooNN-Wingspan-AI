# Builds the terminal version (src/bin/terminal.rs) for Linux, macOS and Windows
# when a version tag (v*) is pushed, and attaches the downloads to that tag's
# release, creating the release if needed. Run by hand, it keeps the builds as
# workflow artifacts instead.
name: Build terminal version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: release
    # Still runs when started by hand, which skips the release job
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Small, self-contained binaries: no debug info, and no Visual C++ runtime needed on Windows
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_STRIP: "true"
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Without the default `python` feature, so the binary doesn't need Python or PyTorch
      - name: Build
        run: cargo build --release --locked --no-default-features --features terminal --bin terminal --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          dir=loonn-terminal-${{ matrix.name }}
          mkdir "$dir"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/terminal.exe "$dir/loonn-terminal.exe"
            7z a "$dir.zip" "$dir" > /dev/null
            echo "file=$dir.zip" >> "$GITHUB_OUTPUT"
          else
            cp target/${{ matrix.target }}/release/terminal "$dir/loonn-terminal"
            tar -czf "$dir.tar.gz" "$dir"
            echo "file=$dir.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --clobber

      - name: Keep as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: loonn-terminal-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
