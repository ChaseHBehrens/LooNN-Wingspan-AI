[workspace]
members = [".", "web"]

[package]
name = "loonn"
version = "0.1.0"
edition = "2024"

[features]
default = ["python", "terminal"]
# The PyTorch network, for training and the tools in src/bin
python = ["dep:pyo3"]
# Terminal prompts in src/user_interface
terminal = ["dep:inquire"]

[dependencies]
inquire = { version = "0.9.4", optional = true }
paste = "1.0.15"
pyo3 = { version = "0.29.2", features = ["auto-initialize"], optional = true }
rand = "0.10.2"

[profile.release]
debug = true
strip = false

# The WebAssembly build of the play page (web/build.sh)
[profile.web]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
