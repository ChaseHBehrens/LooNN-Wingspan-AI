<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play with LooNN</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
  // Before the page draws, so a saved theme doesn't flash the other one first
  try {
    const theme = localStorage.getItem("loonn-theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
  } catch { }
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff; --ink: #111213; --muted: #5b5f64; --line: #c9cbcd; --soft: #e4e5e6;
    --accent: #d0262c; --warn: #d0262c; --head: #111213; --head-ink: #ffffff;
    --forest: #3f7d3a; --grassland: #c9a227; --wetland: #2b6ca3;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121416; --ink: #ececec; --muted: #9ea3aa; --line: #3a3e44; --soft: #2a2d31;
      --accent: #e8595c; --warn: #e8595c; --head: #000000; --head-ink: #ececec;
      --forest: #62a85c; --grassland: #d8b53c; --wetland: #5a9bd0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121416; --ink: #ececec; --muted: #9ea3aa; --line: #3a3e44; --soft: #2a2d31;
    --accent: #e8595c; --warn: #e8595c; --head: #000000; --head-ink: #ececec;
    --forest: #62a85c; --grassland: #d8b53c; --wetland: #5a9bd0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }

  header { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: 16px 40px; border-bottom: 2px solid var(--ink); box-shadow: 0 3px 0 var(--bg), 0 4px 0 var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.05em; line-height: 1; }
  .brand h1 span { color: var(--accent); }
  .tag { color: var(--muted); }
  .progress { flex: 0 1 460px; min-width: 240px; }
  .progress-text { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; margin-bottom: 6px; }
  .progress-text b { font-weight: 600; }
  .progress-text span { color: var(--muted); }
  .bar { display: flex; gap: 3px; height: 6px; }
  .bar div { background: var(--soft); }
  .bar .done { background: var(--ink); }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .stats { display: flex; gap: 28px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .stat { font-size: 12px; color: var(--muted); }
  .stat div { color: var(--ink); font: 500 22px/1.3 var(--mono); }
  .stat small { font-size: 12px; color: var(--muted); margin-left: 6px; }

  .theme-toggle { position: relative; flex: none; width: 52px; height: 26px; padding: 0; border: 1.5px solid var(--ink); }
  .theme-toggle svg { position: absolute; top: 5px; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .theme-toggle svg:first-child { left: 5px; }
  .theme-toggle svg:nth-child(2) { right: 5px; }
  .theme-toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; background: var(--ink); transition: left .15s; }
  .theme-toggle[aria-checked="true"]::after { left: 28px; }
  @media (prefers-reduced-motion: reduce) { .theme-toggle::after { transition: none; } }
  @media (max-width: 1100px) {
    .brand { flex: 1; }
    .theme-toggle { order: 1; }
    .progress, .stats { order: 2; }
  }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; padding: 28px 40px; max-width: 1440px; margin: 0 auto; }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); padding: 20px 16px; } .ask-col { order: -1; } header { padding: 14px 16px; } .stats { margin-left: 0; } .progress { flex-basis: 100%; } }
  section { margin-bottom: 28px; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
  .sec-head h2 { margin: 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  .sec-head h2 span { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .sec-head small { font-size: 12px; color: var(--muted); }

  button { font: inherit; cursor: pointer; border-radius: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 7px 12px; }
  #restart { border: 1.5px solid var(--ink); font-weight: 600; padding: 11px 16px; }
  button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; font-size: 15px; padding: 13px 20px; }
  button:disabled { opacity: .5; cursor: default; }
  input { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--ink); border-radius: 0; padding: 11px 14px; width: 100%; }
  input.bad { border-color: var(--warn); }
  label.field { display: block; margin-bottom: 12px; }
  label.field > span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .error { color: var(--warn); margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .thinking { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .row { display: grid; grid-template-columns: 130px repeat(5, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .habitat { padding: 12px 0; align-self: center; }
  .habitat b { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; text-transform: capitalize; }
  .habitat b::before { content: ""; width: 10px; height: 10px; background: var(--color); }
  .habitat small { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .forest { --color: var(--forest); } .grassland { --color: var(--grassland); } .wetland { --color: var(--wetland); }
  .slot { display: flex; flex-direction: column; min-height: 120px; padding: 12px; border-left: 1px solid var(--line); }
  .slot-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .slot .name { font-weight: 500; line-height: 1.25; }
  .badge { flex: none; min-width: 19px; padding: 1px 4px; text-align: center; background: var(--ink); color: var(--bg); font: 500 12px/17px var(--mono); }
  .eggs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .eggs i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--muted); }
  .eggs i.laid { background: var(--ink); border-color: var(--ink); }
  .slot .foot { margin-top: auto; padding-top: 10px; font: 11.5px var(--mono); color: var(--muted); }
  @media (max-width: 700px) {
    .row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .habitat { grid-column: 1 / -1; }
    .slot { min-height: 100px; }
    .slot:nth-child(3n + 2) { border-left: 0; padding-left: 0; }
  }

  .lists { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 700px) { .lists { grid-template-columns: minmax(0, 1fr); gap: 0; } }
  .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--soft); }
  .line span:last-child { flex: none; font: 12px var(--mono); color: var(--muted); }
  .none { padding: 10px 0; color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; background: var(--muted); }
  .dot + .dot { margin-left: -5px; }
  .f-fish { background: #2b6ca3; } .f-seed { background: #c9a227; } .f-invertebrate { background: #7a5a3a; }
  .f-fruit { background: #b83a6a; } .f-rodent { background: #6b7078; }
  .f-wild { background: none; border: 2px solid var(--muted); }

  .goals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 700px) { .goals { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .goal { padding: 12px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
  .goal:first-child { border-left: 0; padding-left: 0; }
  .goal small { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .goal div { margin: 4px 0; font-size: 15px; line-height: 1.3; }
  .goal code { font: 12px var(--mono); color: var(--muted); }
  .goal.past div { color: var(--muted); }
  .goal.now { border-bottom: 3px solid var(--ink); }
  .goal.now small { color: var(--accent); }

  .ask { border: 2px solid var(--ink); }
  .ask-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px 9px 16px; background: var(--head); color: var(--head-ink); }
  .ask-head code { font: 12px var(--mono); }
  .badge-do { padding: 2px 7px; background: #d0262c; color: #ffffff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .badge-do.wait { background: #5b5f64; }
  .checker { height: 8px; background: repeating-conic-gradient(var(--head) 0 25%, var(--head-ink) 0 50%) 0 0 / 8px 8px; }
  #ask { display: flex; flex-direction: column; min-height: 440px; padding: 20px 16px 16px; }
  #ask h3 { margin: 0 0 12px; font-size: 21px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
  #ask .sub { margin: -4px 0 12px; font-size: 13px; color: var(--muted); }
  .actions { display: flex; align-items: center; gap: 14px; margin-top: auto; padding-top: 16px; }
  .actions button.primary { width: 100%; }
  #ask .primary:disabled { opacity: 1; background: var(--line); border-color: var(--line); color: var(--muted); }

  #ask .error { display: flex; gap: 8px; padding: 10px 12px; border: 1px solid var(--warn); font-size: 13px; }
  .bird-box { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); margin-bottom: 12px; }
  .bird-box .name { font-weight: 600; }
  .bird-box .detail { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .thinking { display: flex; gap: 12px; align-items: center; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
  .thinking + p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

  .question { margin: 0 0 8px; font-size: 13px; font-weight: 500; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .toggle { display: flex; align-items: center; gap: 7px; padding: 8px 10px; font-size: 13px; }
  .toggle::before { content: ""; width: 9px; height: 9px; border: 1px solid var(--muted); }
  .toggle.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .toggle.on::before { background: #d0262c; border-color: #d0262c; }
  #ask details { padding-top: 12px; border-top: 1px solid var(--line); }
  #ask summary { cursor: pointer; font-size: 13px; font-weight: 500; }
  #ask details label.field { margin: 10px 0 0; }

  .tray-slot { margin-bottom: 8px; padding: 8px 10px 10px; border: 1px solid var(--line); }
  .tray-slot.open { border: 1px dashed var(--accent); }
  .tray-slot > div:first-child { display: flex; justify-content: space-between; align-items: center; min-height: 20px; margin-bottom: 6px; font: 12px var(--mono); color: var(--muted); }
  .tray-slot .detail { margin-top: 6px; font-size: 12px; color: var(--muted); }

  .dice-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  .die { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 58px; padding: 6px 2px; border: 1.5px solid var(--ink); font-size: 11px; font-weight: 500; }
  .die .dot { margin: 0; }
  .die.open { border: 1px dashed var(--accent); color: var(--muted); font-weight: 400; }
  .dice-faces { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .dice-faces button { display: flex; align-items: center; text-align: left; padding: 9px 10px; font-size: 13px; text-transform: capitalize; }
  .dice-count { display: flex; justify-content: space-between; gap: 8px; font: 12px var(--mono); color: var(--muted); }

  .final { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
  .final b { font-size: 60px; font-weight: 700; line-height: 1; letter-spacing: -.04em; }
  .final span { color: var(--muted); }
  .predicted-box { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border: 1px solid var(--line); color: var(--muted); }
  .predicted-box div { color: var(--ink); font: 500 20px var(--mono); }
  .predicted-box small { margin-left: 6px; font-size: 12px; color: var(--muted); }

  .options:empty { display: none; }
  .options { border: 1px solid var(--line); border-top: 0; }
  #ask .combo .options { margin-bottom: 4px; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--soft); cursor: pointer; }
  .opt .name { font-weight: 600; }
  .opt .detail { font-size: 12px; color: var(--muted); }
  .opt .pts { flex: none; font: 12px var(--mono); }
  .opt.on { background: var(--ink); color: var(--bg); border-top-color: var(--ink); }
  .opt.on .detail { color: inherit; opacity: .75; }

  .done-row { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--soft); font-size: 13px; color: var(--muted); }
  .done-row code { font: 11px/19px var(--mono); }
  .done-row.current { padding-left: 8px; border-left: 2px solid var(--accent); color: var(--ink); font-weight: 600; }
  .done-row.current code { color: var(--accent); }
  details.earlier { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 20px; }
  details.earlier summary { padding: 13px 0; cursor: pointer; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
  details.earlier summary span { font-weight: 400; color: var(--muted); }
  .entry { padding: 8px 0 12px; }
  .entry h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .entry ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }


  .setup-tag, #setup { display: none; }
  body.setup-mode main, body.setup-mode .progress, body.setup-mode .stats { display: none; }
  body.setup-mode #setup { display: flex; flex-direction: column; min-height: calc(100vh - 72px); }
  body.setup-mode header { padding: 16px 64px; }
  body.setup-mode .setup-tag { display: block; margin-left: auto; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .setup-body { width: 100%; max-width: 1440px; margin: 0 auto; padding: 36px 64px 28px; }
  .setup-intro { display: flex; justify-content: space-between; align-items: flex-start; gap: 40px; margin-bottom: 32px; }
  .setup-intro h2 { margin: 0 0 8px; font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: -.045em; }
  .setup-intro p { margin: 0; max-width: 620px; font-size: 17px; color: var(--muted); }
  .setup-steps { flex: 0 0 512px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; padding: 0; list-style: none; border: 1px solid var(--ink); }
  .setup-steps li { padding: 14px 16px; font-size: 13px; }
  .setup-steps li + li { border-left: 1px solid var(--line); }
  .setup-steps code { display: block; margin-bottom: 6px; font: 500 12px var(--mono); color: var(--accent); }
  .setup-cols { display: grid; grid-template-columns: minmax(220px, 304px) minmax(0, 1fr) minmax(220px, 304px); gap: 32px; }
  .setup-cols section { margin: 0; }
  .setup-cols .sec-head small { font: 12px var(--mono); }
  .setup-hint { margin: 12px 0; font-size: 13px; color: var(--muted); }
  .setup-cols label.field { margin-bottom: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--soft); }
  #setup input:placeholder-shown { border-color: var(--line); }
  #setup .combo { position: relative; }
  #setup .options { position: absolute; z-index: 2; left: 0; right: 0; background: var(--bg); }
  .dealt { display: grid; grid-template-columns: 26px minmax(0, 5fr) minmax(0, 6fr); gap: 12px; align-items: center; padding: 8px 0 12px; border-bottom: 1px solid var(--soft); }
  .dealt > code { font: 12px var(--mono); color: var(--muted); }
  .dealt-card { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--muted); }
  .dealt-card .detail { font-size: 12px; color: var(--muted); }
  .homes { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--ink); }
  .home { display: flex; align-items: center; gap: 6px; }
  .home::before { content: ""; width: 10px; height: 10px; background: var(--color); }
  .setup-next { margin-top: 20px; border: 2px solid var(--ink); }
  .setup-next div:last-child { padding: 14px 16px; font-size: 13px; color: var(--muted); }
  .setup-next b { display: block; margin-bottom: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
  .setup-foot { position: sticky; bottom: 0; z-index: 3; margin-top: auto; background: var(--bg); border-top: 2px solid var(--ink); }
  .setup-foot > div { display: flex; align-items: center; gap: 20px; max-width: 1440px; margin: 0 auto; padding: 14px 64px; }
  .setup-progress { flex: 0 0 420px; font-size: 13px; }
  .setup-progress b { display: block; margin-bottom: 6px; font-weight: 600; }
  .setup-progress .bar i { background: var(--ink); }
  .setup-note { flex: 1; font-size: 13px; color: var(--muted); }
  #setup .setup-note.error { margin: 0; color: var(--warn); }
  .setup-foot button.primary:disabled { opacity: 1; background: var(--line); border-color: var(--line); color: var(--muted); }
  @media (max-width: 1100px) {
    body.setup-mode header { padding: 14px 16px; }
    .setup-body { padding: 24px 16px; }
    .setup-intro { flex-direction: column; gap: 20px; }
    .setup-steps { flex: none; width: 100%; }
    .setup-cols { grid-template-columns: minmax(0, 1fr); gap: 24px; }
    .setup-foot > div { flex-wrap: wrap; padding: 12px 16px; gap: 10px 16px; }
    .setup-progress { flex: 1 1 100%; }
  }
  @media (max-width: 600px) {
    .setup-intro h2 { font-size: 36px; }
    .setup-steps { grid-template-columns: minmax(0, 1fr); }
    .setup-steps li + li { border-left: 0; border-top: 1px solid var(--line); }
    .dealt { grid-template-columns: 26px minmax(0, 1fr); }
    .dealt-card { grid-column: 2; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Loo<span>NN</span></h1><span class="tag">Wingspan AI</span></div>
  <div class="progress" id="progress" hidden>
    <div class="progress-text"><b id="round"></b><span id="turns"></span></div>
    <div class="bar" id="bar"></div>
  </div>
  <div class="stats">
    <div class="stat">Score<div id="score">–</div></div>
    <div class="stat">Predicted final<div><span id="predicted">–</span><small id="delta"></small></div></div>
    <button id="restart">New game</button>
  </div>
  <span class="setup-tag">New game · Setup</span>
  <button class="theme-toggle" id="theme" role="switch" aria-checked="false" aria-label="Dark mode" title="Switch between light and dark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
  </button>
</header>
<div id="setup"></div>
<main>
  <div class="board-col">
    <section>
      <div class="sec-head"><h2>LooNN's mat</h2><small>Hover a bird for its power</small></div>
      <div id="mat"><p class="muted">Enter the setup to start.</p></div>
    </section>
    <div class="lists">
      <section><div class="sec-head"><h2>Hand <span id="hand-count"></span></h2></div><div id="hand"></div></section>
      <section><div class="sec-head"><h2>Food <span id="food-count"></span></h2></div><div id="food"></div></section>
      <section><div class="sec-head"><h2>Bonus</h2></div><div id="bonus"></div></section>
    </div>
    <section><div class="sec-head"><h2>Round goals</h2></div><div id="goals" class="goals"></div></section>
  </div>
  <div class="ask-col">
    <section class="ask">
      <div class="ask-head"><code id="step"></code><span class="badge-do" id="badge"></span></div>
      <div class="checker"></div>
      <div id="ask"></div>
    </section>
    <section>
      <div class="sec-head"><h2>This turn</h2><small id="log-title"></small></div>
      <div id="log"></div>
    </section>
  </div>
</main>

<script>
const HABITATS = ["forest", "grassland", "wetland"];
const HABITAT_ACTION = { forest: "Gain food", grassland: "Lay eggs", wetland: "Draw cards" };
// Eggs it costs to play a bird in each column of the mat
const SLOT_EGGS = [0, 1, 1, 2, 2];
const FOODS = ["invertebrate", "seed", "fish", "fruit", "rodent"];
const ROUND_TURNS = [8, 7, 6, 5];
const ROUND_ENDS = [18, 11, 5, 0];
let catalog = null, seq = -1, viewText = "", view = null, sending = false;
let backend = null, awaiting = -1, promptKind = null;
let lastPredicted = null, earlierOpen = false, shownPrompt = null, thinkingText = null;
// The turn in progress: where its moves start in the log, the moves made on the
// table, the birds and bonus cards entered, and the list of what's happened
let turnStart = null, turnLabel = null, madeMoves = [], toldCards = [], turnRows = [], toldLast = false;
let lastBirdAnswer = "";

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid);
  return e;
};
const birdNames = () => Object.keys(catalog.birds);
const findName = (list, name) => list.find(n => n.toLowerCase() === name.trim().toLowerCase());
const capitalize = s => s[0].toUpperCase() + s.slice(1);
// Foods as colored dots. A die like "invertebrate/seed" gets a dot per food.
const foodDots = f => f.split("/").map(part => el("i", { class: `dot f-${part}` }));

function birdTitle(name) {
  const b = catalog.birds[name];
  if (!b) return name;
  const cost = b.cost.food.length ? b.cost.food.join(b.cost.kind === "one_of" ? " or " : " + ") : "free";
  return `${name}\n${b.points} pts · ${b.habitats.join("/")} · ${b.nest} nest · ${b.egg_limit} eggs · ${b.wingspan} cm\nCost: ${cost}\n${b.power_text || "No power"}`;
}

function birdCost(b, alwaysCount = false) {
  const counts = new Map();
  for (const f of b.cost.food) counts.set(f, (counts.get(f) || 0) + 1);
  const oneOf = b.cost.kind === "one_of";
  return [...counts].map(([f, n]) => n > 1 || f === "wild" || (alwaysCount && !oneOf) ? `${n} ${f}` : f).join(oneOf ? " or " : " + ") || "free";
}

function birdDetail(b) {
  const habitats = b.habitats.length === HABITATS.length ? "All habitats" : b.habitats.map(capitalize).join("/");
  return [habitats, b.nest === "none" ? null : b.nest, birdCost(b)].filter(Boolean).join(" · ");
}

// What's needed from a list of numbered things, like "birds 4–5" or "bonus 2"
function missingText(numbers, one, many, suffix = "") {
  if (!numbers.length) return null;
  if (numbers.length === 1) return `${one} ${numbers[0]}${suffix}`;
  const consecutive = numbers.every((n, i) => !i || n === numbers[i - 1] + 1);
  return `${many} ${consecutive ? `${numbers[0]}–${numbers[numbers.length - 1]}` : numbers.join(", ")}${suffix}${suffix && "s"}`;
}

// Answers the prompt. `told` is how the "This turn" list words the answer.
async function send(lines, told = null) {
  if (sending) return;
  sending = true;
  document.querySelectorAll("#ask button").forEach(b => b.disabled = true);
  toldLast = !!told;
  if (told) turnRows.push(told);
  // Shows that LooNN is thinking until a newer prompt arrives
  awaiting = seq;
  renderPrompt(null, "LooNN is thinking…");
  try {
    await backend.answer(seq, lines);
  } finally {
    sending = false;
  }
}

// ---- Board ----

// The round and the turn within it, given the turns a player has left
function roundTurn(left) {
  const round = ROUND_ENDS.findIndex(end => left > end || end === 0) + 1;
  return { round, turn: ROUND_TURNS[round - 1] - (left - ROUND_ENDS[round - 1]) + 1 };
}

function renderProgress(p) {
  $("progress").hidden = !p;
  if (!p) return;
  const over = view.status === "Game over";
  const left = p.turns_left;
  const { round, turn } = over ? { round: 4, turn: 0 } : roundTurn(left);
  $("round").textContent = over ? "Game over" : left === 0 ? "Final scoring" : `Round ${round} · turn ${turn} of ${ROUND_TURNS[round - 1]}`;
  $("turns").textContent = over || left === 0 ? "" : `${left} ${left === 1 ? "turn" : "turns"} left`;
  $("bar").replaceChildren(...ROUND_TURNS.map((turns, i) => {
    const done = over || left === 0 || i + 1 < round;
    const current = !done && i + 1 === round;
    return el("div", { class: done ? "done" : "", style: `flex: ${turns}` },
      current ? el("i", { style: `width: ${turn / turns * 100}%` }) : null);
  }));
}

function renderPredicted() {
  const over = view.status === "Game over";
  const value = view.predicted;
  $("predicted").textContent = value == null ? "–" : over ? value : value.toFixed(1);
  if (value == null || over) $("delta").textContent = "";
  else if (lastPredicted != null && value !== lastPredicted) {
    const change = value - lastPredicted;
    $("delta").textContent = `${change > 0 ? "+" : ""}${change.toFixed(1)}`;
  }
  lastPredicted = value;
}

function renderMat(p) {
  $("mat").replaceChildren(...HABITATS.map(h => el("div", { class: `row ${h}` },
    el("div", { class: "habitat" }, el("b", {}, h), el("small", {}, HABITAT_ACTION[h])),
    [0, 1, 2, 3, 4].map(i => {
      const s = p.habitats[h][i];
      if (!s) {
        const eggs = SLOT_EGGS[i];
        return el("div", { class: "slot" }, el("div", { class: "foot" }, eggs ? `${eggs} ${eggs === 1 ? "egg" : "eggs"}` : "no eggs"));
      }
      const b = catalog.birds[s.bird];
      return el("div", { class: "slot", title: birdTitle(s.bird) },
        el("div", { class: "slot-top" }, el("div", { class: "name" }, s.bird), el("span", { class: "badge" }, b.points)),
        el("div", { class: "eggs" }, Array.from({ length: b.egg_limit }, (_, n) => el("i", { class: n < s.eggs ? "laid" : "" }))),
        el("div", { class: "foot" }, [b.nest === "none" ? null : b.nest, `${b.wingspan}cm`].filter(Boolean).join(" · ")));
    }))));
}

function renderLists(p) {
  const empty = text => [el("div", { class: "none" }, text)];
  $("hand-count").textContent = p.hand.length;
  $("hand").replaceChildren(...(p.hand.length ? p.hand.map(n => el("div", { class: "line", title: birdTitle(n) },
    el("span", {}, n), el("span", {}, `${catalog.birds[n].points} pt`))) : empty("Empty")));
  const food = new Map();
  for (const f of p.food) food.set(f, (food.get(f) || 0) + 1);
  $("food-count").textContent = p.food.length;
  $("food").replaceChildren(...(p.food.length ? [...food].map(([f, n]) => el("div", { class: "line" },
    el("span", {}, foodDots(f), capitalize(f)), el("span", {}, `×${n}`))) : empty("None")));
  $("bonus").replaceChildren(...(p.bonus.length ? p.bonus.map(b => el("div", { class: "line" },
    el("span", {}, b.name), el("span", {}, `${b.score} pt now`))) : empty("None")));
}

// What a finished round's goal scored, from the log's line for it
function roundGoalPoints(round) {
  const entry = view.log.find(e => e.title === `End of round ${round}`);
  const scored = entry && entry.lines.map(l => l.match(/^Scored (\d+) points for the round goal/)).find(Boolean);
  return scored ? scored[1] : null;
}

function renderGoals(p) {
  const over = view.status === "Game over";
  const current = over ? 5 : roundTurn(p.turns_left).round;
  $("goals").replaceChildren(...p.goals.map((g, i) => {
    const round = i + 1;
    const points = round === 4 && over ? g.score : roundGoalPoints(round);
    const note = round === current ? `${g.score} pt now` : round < current && points != null ? `${points} pt scored` : "–";
    return el("div", { class: `goal ${round === current ? "now" : round < current ? "past" : ""}` },
      el("small", {}, `Round ${round}`), el("div", {}, g.name), el("code", {}, note));
  }));
}

// The log calls turns by their number in the game, and the page by their number in the round
function entryTitle(title) {
  const turn = title.match(/^Turn (\d+) \(round (\d)\)$/);
  if (!turn) return title;
  const round = Number(turn[2]);
  const before = ROUND_TURNS.slice(0, round - 1).reduce((a, b) => a + b, 0);
  return `Turn ${Number(turn[1]) - before} · round ${round}`;
}

function renderThisTurn(current) {
  $("log-title").textContent = turnLabel ? `Turn ${turnLabel.turn} · round ${turnLabel.round}` : view && view.player ? "Setup" : "";
  const rows = [...turnRows, ...(current ? [current] : [])];
  const earlier = view ? view.log.slice(0, turnStart ?? view.log.length).reverse() : [];
  const history = earlier.length ? el("details", { class: "earlier", open: earlierOpen, ontoggle: e => { earlierOpen = e.target.open; } },
    el("summary", {}, "Previous turns ", el("span", {}, `· ${earlier.length}`)),
    earlier.map(e => el("div", { class: "entry" }, el("h4", {}, entryTitle(e.title)),
      e.lines.length ? el("ul", {}, e.lines.map(l => el("li", {}, l))) : el("div", { class: "muted" }, "Nothing to do")))) : null;
  $("log").replaceChildren(...[
    ...rows.map((text, i) => el("div", { class: `done-row${current && i === rows.length - 1 ? " current" : ""}` }, el("code", {}, i + 1), el("span", {}, text))),
    history,
  ].filter(Boolean));
}

function renderView() {
  const p = view.player;
  $("score").textContent = p ? p.score : "–";
  renderPredicted();
  renderProgress(p);
  if (p) {
    renderMat(p);
    renderLists(p);
    renderGoals(p);
  } else {
    $("mat").replaceChildren(el("p", { class: "muted" }, "Enter the setup to start."));
    ["hand", "food", "bonus", "goals", "hand-count", "food-count"].forEach(id => $(id).replaceChildren());
  }
  if (turnStart === null) turnStart = view.log.length;
  renderThisTurn(currentRow());
}

// ---- Prompts ----

const BIRD_CARDS = {
  names: () => birdNames(),
  title: birdTitle,
  detail: n => birdDetail(catalog.birds[n]),
  points: n => catalog.birds[n].points,
};
const BONUS_CARDS = { names: () => catalog.bonuses, title: n => n };
const GOAL_CARDS = { names: () => catalog.goals, title: n => n };

// A text box that lists the cards matching what's typed. Put `input.box` on the
// page. `input.pick()` is the card it would choose, and `input.onPick` runs when
// that changes. With `input.confirmOnPick`, Enter on a listed card also submits.
function cardInput(cards, value = "", placeholder = "Type a name…") {
  const input = el("input", { placeholder, value, autocomplete: "off", role: "combobox", "aria-expanded": "false" });
  const options = el("div", { class: "options", role: "listbox" });
  let matches = [], on = 0;
  input.box = el("div", { class: "combo" }, input, options);
  input.exact = () => findName(cards.names(), input.value);
  input.pick = () => input.exact() || matches[on] || "";
  const draw = () => {
    options.replaceChildren(...matches.map((n, i) => el("div", {
      class: `opt${i === on ? " on" : ""}`, role: "option", "aria-selected": String(i === on), title: cards.title(n),
      // Keeps the focus in the box, which would otherwise close the list before the click lands
      onmousedown: e => e.preventDefault(),
      onclick: () => choose(n),
    }, el("div", {}, el("div", { class: "name" }, n), cards.detail ? el("div", { class: "detail" }, cards.detail(n)) : null),
      cards.points ? el("span", { class: "pts" }, `${cards.points(n)} pt`) : null)));
    input.setAttribute("aria-expanded", String(matches.length > 0));
    input.classList.toggle("bad", input.value.trim() !== "" && !input.pick());
    input.title = input.exact() ? cards.title(input.exact()) : "";
    if (input.onPick) input.onPick();
  };
  const choose = name => {
    input.value = name;
    matches = [];
    draw();
  };
  input.addEventListener("input", () => {
    const typed = input.value.trim().toLowerCase();
    const names = cards.names().map(n => [n, n.toLowerCase()]);
    matches = !typed || input.exact() ? [] : [
      ...names.filter(([, n]) => n.startsWith(typed)),
      ...names.filter(([, n]) => !n.startsWith(typed) && n.includes(typed)),
    ].slice(0, 4).map(([n]) => n);
    on = 0;
    draw();
  });
  input.addEventListener("keydown", e => {
    if (!matches.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      on = (on + (e.key === "ArrowDown" ? 1 : matches.length - 1)) % matches.length;
      draw();
    } else if (e.key === "Enter" || e.key === "Tab") {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!input.confirmOnPick) e.stopImmediatePropagation();
      }
      choose(matches[on]);
    } else if (e.key === "Escape") {
      matches = [];
      draw();
    }
  });
  input.addEventListener("blur", () => { matches = []; draw(); });
  return input;
}

const birdInput = (value = "", placeholder = "Type a bird name…") => cardInput(BIRD_CARDS, value, placeholder);

const field = (label, input) => el("label", { class: "field" }, el("span", {}, label), input);

function submitOnEnter(form, inputs) {
  inputs.forEach(i => i.addEventListener("keydown", e => {
    if (e.key === "Enter" && !(i.value && !i.exact())) { e.preventDefault(); form(); }
  }));
}

const doneButton = (onclick, label = "Done") => el("div", { class: "actions" }, el("button", { class: "primary", onclick }, label));
const dieName = d => d === "invertebrate/seed" ? "Inv/seed" : d;
const birdBox = name => el("div", { class: "bird-box", title: birdTitle(name) },
  el("div", {}, el("div", { class: "name" }, name), el("div", { class: "detail" }, birdDetail(catalog.birds[name]))),
  el("span", { class: "badge" }, catalog.birds[name].points));

const PROMPTS = {
  setup(p) {
    const goals = [0, 1, 2, 3].map(() => cardInput(GOAL_CARDS, "", "Type a goal…"));
    const birds = [0, 1, 2, 3, 4].map(() => birdInput());
    const bonuses = [0, 1].map(() => cardInput(BONUS_CARDS, "", "Type a bonus card…"));
    const go = () => send([
      ...goals.map(g => "goal:" + (g.pick() || g.value)),
      ...birds.map(b => "bird:" + (b.pick() || b.value)),
      ...bonuses.map(b => "bonus:" + (b.pick() || b.value)),
    ]);
    const cards = birds.map(() => el("div", { class: "dealt-card" }));
    const [goalCount, birdCount, bonusCount] = [0, 1, 2].map(() => el("small"));
    const entered = el("b"), fill = el("i");
    const note = el("p", { class: "setup-note" });
    const start = el("button", { class: "primary", onclick: go, disabled: true }, "Start game");
    const refresh = () => {
      birds.forEach((b, i) => {
        const name = b.pick();
        const bird = name && catalog.birds[name];
        const facts = bird && [bird.nest === "none" ? null : `${capitalize(bird.nest)} nest`, `${bird.egg_limit} ${bird.egg_limit === 1 ? "egg" : "eggs"}`, birdCost(bird, true)];
        cards[i].title = bird ? birdTitle(name) : "";
        cards[i].replaceChildren(...(bird ? [
          el("span", { class: "badge" }, bird.points),
          el("div", {}, el("div", { class: "homes" }, bird.habitats.map(h => el("span", { class: `home ${h}` }, capitalize(h)))),
            el("div", { class: "detail" }, facts.filter(Boolean).join(" · "))),
        ] : ["–"]));
      });
      const unfilled = list => list.flatMap((v, i) => v ? [] : [i + 1]);
      const [goalValues, birdValues, bonusValues] = [goals, birds, bonuses].map(list => list.map(i => i.exact()));
      const [noGoals, noBirds, noBonuses] = [goalValues, birdValues, bonusValues].map(unfilled);
      const done = 11 - noGoals.length - noBirds.length - noBonuses.length;
      goalCount.textContent = `${4 - noGoals.length}/4`;
      birdCount.textContent = `${5 - noBirds.length}/5`;
      bonusCount.textContent = `${2 - noBonuses.length}/2`;
      entered.textContent = `${done} of 11 cards entered`;
      fill.style.width = `${done / 11 * 100}%`;
      const missing = [missingText(noGoals, "round", "rounds", " goal"), missingText(noBirds, "bird", "birds"), missingText(noBonuses, "bonus", "bonuses")].filter(Boolean);
      const repeated = list => list.some((v, i) => v && list.indexOf(v) !== i);
      const twice = [repeated(goalValues) && "a round goal", repeated(birdValues) && "a bird", repeated(bonusValues) && "a bonus card"].filter(Boolean);
      start.disabled = missing.length > 0 || twice.length > 0;
      note.classList.toggle("error", twice.length > 0 || (!!p.error && !missing.length));
      note.textContent = twice.length ? `You entered ${twice.join(" and ")} twice` :
        missing.length ? `Missing: ${missing.join(", ")}` : p.error || "Everything's entered";
    };
    [...goals, ...birds, ...bonuses].forEach(i => { i.onPick = refresh; });
    refresh();
    return [
      el("div", { class: "setup-body" },
        el("div", { class: "setup-intro" },
          el("div", {},
            el("h2", {}, "Deal LooNN in."),
            el("p", {}, "Set up the table as usual, then tell LooNN what it was dealt. It will choose which birds and bonus card to keep.")),
          el("ol", { class: "setup-steps" },
            ["Deal LooNN 5 birds and 2 bonus cards", "Enter them here with the round goals", "Give LooNN 5 food minus the birds it keeps"].map((text, i) =>
              el("li", {}, el("code", {}, `0${i + 1}`), text)))),
        el("div", { class: "setup-cols" },
          el("section", {},
            el("div", { class: "sec-head" }, el("h2", {}, "Round goals"), goalCount),
            el("p", { class: "setup-hint" }, "From the goal board, top to bottom."),
            goals.map((g, i) => field(`Round ${i + 1}`, g.box))),
          el("section", {},
            el("div", { class: "sec-head" }, el("h2", {}, "Birds dealt"), birdCount),
            el("p", { class: "setup-hint" }, "Type to search. Each match shows the card so you can check it."),
            birds.map((b, i) => el("div", { class: "dealt" }, el("code", {}, i + 1), b.box, cards[i]))),
          el("section", {},
            el("div", { class: "sec-head" }, el("h2", {}, "Bonus cards"), bonusCount),
            el("p", { class: "setup-hint" }, "LooNN keeps one."),
            bonuses.map((b, i) => field(`Bonus ${i + 1}`, b.box)),
            el("div", { class: "setup-next" }, el("div", { class: "checker" }),
              el("div", {}, el("b", {}, "Next"), "LooNN shows which birds, food and bonus card to keep. You discard the rest on the table."))))),
      el("div", { class: "setup-foot" }, el("div", {},
        el("div", { class: "setup-progress" }, entered, el("div", { class: "bar" }, el("div", { style: "flex: 1" }, fill))),
        note, start)),
    ];
  },

  bird(p) {
    // A rejected bird stays in the box, so it's clear what was wrong
    const input = birdInput(p.error ? lastBirdAnswer : "");
    const go = () => {
      const name = input.pick() || input.value;
      lastBirdAnswer = name;
      toldCards.push(name);
      send([name], `Drew ${name}`);
    };
    input.confirmOnPick = true;
    if (p.error) input.classList.add("bad");
    submitOnEnter(go, [input]);
    setTimeout(() => input.focus());
    return [input.box, doneButton(go)];
  },

  bonus(p) {
    const input = cardInput(BONUS_CARDS, "", "Type a bonus card…");
    const go = () => {
      const name = input.pick() || input.value;
      toldCards.push(name);
      send([name], `Drew ${name}`);
    };
    input.confirmOnPick = true;
    submitOnEnter(go, [input]);
    setTimeout(() => input.focus());
    return [input.box, doneButton(go)];
  },

  tray(p) {
    const inputs = [0, 1, 2].map(i => birdInput(p.prefill[i] || "", "Type a bird…"));
    const go = () => send(inputs.map(i => i.pick() || i.value).filter(v => v.trim()), "Checked the tray");
    const slots = inputs.map((input, n) => {
      const badge = el("span"), detail = el("div", { class: "detail" });
      const slot = el("div", { class: "tray-slot" }, el("div", {}, `slot ${n + 1}`, badge), input.box, detail);
      input.onPick = () => {
        const name = input.pick();
        slot.classList.toggle("open", !name);
        badge.className = name ? "badge" : "";
        badge.textContent = name ? catalog.birds[name].points : "";
        detail.textContent = name ? birdDetail(catalog.birds[name]) : "";
      };
      input.onPick();
      return slot;
    });
    submitOnEnter(go, inputs);
    setTimeout(() => inputs[0].focus());
    return [
      p.prefill.length ? el("p", { class: "sub" }, "Filled in from last time. Fix anything that changed.") : null,
      slots,
      doneButton(go),
    ];
  },

  dice(p) {
    let picked = [...p.prefill];
    const tiles = el("div", { class: "dice-tiles" });
    const count = el("span");
    const done = el("button", { class: "primary" }, "Done");
    const draw = () => {
      tiles.replaceChildren(...Array.from({ length: p.max }, (_, i) => i < picked.length
        ? el("button", { class: "die", title: "Remove", onclick: () => { picked.splice(i, 1); draw(); } }, foodDots(picked[i]), dieName(picked[i]))
        : el("div", { class: "die open" }, "empty")));
      count.textContent = `${picked.length} of ${p.max} dice`;
      done.disabled = picked.length < p.min || picked.length > p.max;
    };
    const told = p.title.includes("hunting") ? "Rolled the hunting dice" : p.title.includes("rerolls") ? "Rerolled the birdfeeder" : "Checked the birdfeeder";
    done.addEventListener("click", () => send(picked, told));
    draw();
    return [
      el("p", { class: "sub" }, "Tap a face to add a die. Tap a die to remove it."),
      tiles,
      el("div", { class: "dice-faces" }, catalog.dice.map(d =>
        el("button", { onclick: () => { if (picked.length < p.max) { picked.push(d); draw(); } } }, foodDots(d), dieName(d)))),
      el("div", { class: "dice-count" }, count, p.min === 0 ? el("span", {}, "empty feeder? leave it blank") : null),
      el("div", { class: "actions" }, done),
    ];
  },

  turn(p) {
    const player = view.player;
    const checks = [];
    const toggle = (value, label, on = false) => {
      const button = el("button", { class: `toggle${on ? " on" : ""}`, "aria-pressed": String(on), onclick: () => {
        button.checked = !button.checked;
        button.classList.toggle("on", button.checked);
        button.setAttribute("aria-pressed", String(button.checked));
      } }, label);
      button.checked = on;
      button.value = value;
      checks.push(button);
      return button;
    };
    const question = (text, ...buttons) => [el("p", { class: "question" }, text), el("div", { class: "toggles" }, buttons.flat())];
    const shared = birdInput("", "Bird name");
    const fewest = HABITATS.map(h => toggle("fewest:" + h, capitalize(h), player.fewest.includes(h)));
    const parts = [];
    if (player.between_turns) {
      parts.push(
        question("Did another player lay eggs or win a hunt?", toggle("lay_egg", "Laid eggs"), toggle("hunt", "Won a hunt")),
        question("Did they play a bird?", HABITATS.map(h => toggle("play_bird:" + h, capitalize(h)))),
        question("Did they gain food?", FOODS.map(f => toggle("gain_food:" + f, capitalize(f)))));
    }
    if (player.uses_fewest) parts.push(question("LooNN has the fewest birds in… (ties count)", fewest));
    const go = () => {
      const lines = checks.filter(c => c.checked).map(c => c.value);
      const name = shared.pick();
      if (name) lines.push("shared:" + name);
      turnStart = view.log.length;
      send(lines);
    };
    return [
      p.last ? null : parts.length ? null : el("p", { class: "sub" }, "When the other players have taken their turns, let LooNN play."),
      parts.flat(),
      el("details", {}, el("summary", {}, "Another player shared a power with everyone"), field("Which bird?", shared.box)),
      doneButton(go, p.last ? "Score the game" : "Play LooNN's turn"),
    ];
  },

  over(p) {
    const score = view.player ? view.player.score : 0;
    const goals = [1, 2, 3].map(round => [`Round ${round} goal`, Number(roundGoalPoints(round) || 0)]);
    const end = view.log.flatMap(e => e.lines).map(l => l.match(/^Scored (\d+) points for the last round goal/)).find(Boolean);
    const rows = [...goals, ["Last goal, eggs & bonus cards", Number(end ? end[1] : 0)]];
    const others = score - rows.reduce((sum, row) => sum + row[1], 0);
    return [
      el("div", { class: "final" }, el("b", {}, score), el("span", {}, "points")),
      [["Birds, tucks & caches", others], ...rows].map(([name, points]) => el("div", { class: "line" }, el("span", {}, name), el("span", {}, points))),
      doneButton(restart, "New game"),
    ];
  },

  error(p) {
    return [el("p", { class: "muted" }, "The game stopped. Start a new one to keep playing."), doneButton(restart, "New game")];
  },
};

// The moves LooNN has made that still need making on the table. A draw from the deck
// doesn't count, since it was made to answer the question that named the bird.
function movesToMake() {
  if (!view || turnStart === null) return [];
  const made = [...madeMoves], told = [...toldCards];
  const lines = [...view.log.slice(turnStart).flatMap(e => e.lines), ...view.pending];
  return lines.filter(line => {
    const i = made.indexOf(line);
    if (i >= 0) { made.splice(i, 1); return false; }
    if (/^(Scored \d+ points for the last|Final score)/.test(line)) return false;
    const drawn = line.match(/^(?:Draw|Take bonus card) (.+)$/);
    if (drawn && told.includes(drawn[1])) { told.splice(told.indexOf(drawn[1]), 1); return false; }
    return true;
  });
}

// A move as an instruction: the sentence to show, its short form for the list, and what goes under it
function describeMove(line) {
  if (line === "Put an action cube on Play bird") return { title: `${line}.`, row: "Cube on Play bird", extra: null };
  const cube = line.match(/^Put an action cube on (\w+)$/);
  if (cube) return { title: `Put an action cube on ${capitalize(cube[1])}.`, row: `Cube on ${capitalize(cube[1])}`,
    extra: el("div", { class: `home ${cube[1]}` }, HABITAT_ACTION[cube[1]]) };
  const take = line.match(/^Draw (.+)$/);
  if (take) return { title: `Take ${take[1]} from the tray.`, row: `Took ${take[1]}`, extra: birdBox(take[1]) };
  const egg = line.match(/^Lay an egg on (.+)$/);
  if (egg) return { title: `Lay 1 egg on ${egg[1]}.`, row: `Egg on ${egg[1]}`, extra: birdBox(egg[1]) };
  const play = line.match(/^Play (.+) into (\w+)$/);
  if (play) return { title: `Play ${play[1]} into ${capitalize(play[2])}.`, row: `Played ${play[1]}`, extra: birdBox(play[1]) };
  const activate = line.match(/^Activate (.+)$/);
  if (activate) return { title: `Activate ${activate[1]}.`, row: `Activated ${activate[1]}`, extra: birdBox(activate[1]) };
  const scored = line.match(/^Scored 1 points (.+)$/);
  if (scored) return { title: `Scored 1 point ${scored[1]}.`, row: `Scored 1 point ${scored[1]}`, extra: null };
  const past = [[/^Gain /, "Gained "], [/^Discard /, "Discarded "], [/^Take /, "Took "]].find(([word]) => word.test(line));
  return { title: `${line}.`, row: past ? line.replace(past[0], past[1]) : line, extra: null };
}

const turnFinished = () => shownPrompt && shownPrompt.kind === "turn" && view && turnStart !== null && view.log.length > turnStart;
const finishedALoonnTurn = () => view.log.slice(turnStart).some(e => e.title.startsWith("Turn "));

function startNextTurn() {
  turnStart = view.log.length;
  madeMoves = [];
  toldCards = [];
  turnRows = [];
  drawCard();
}

// What the list marks as happening now
function currentRow() {
  if (!shownPrompt) return null;
  const moves = movesToMake();
  if (moves.length) return describeMove(moves[0]).title;
  if (turnFinished()) return null;
  if (shownPrompt.kind === "turn" || shownPrompt.kind === "over" || shownPrompt.kind === "error") return null;
  return shownPrompt.title;
}

function setHead(left, badge, waiting = false) {
  $("step").textContent = left;
  $("badge").textContent = badge;
  $("badge").classList.toggle("wait", waiting);
}

// Shows the next card: moves to make come before the question that follows them
function drawCard() {
  const ask = $("ask");
  const p = shownPrompt;
  const stepLabel = () => `${turnLabel ? `Turn ${turnLabel.turn}` : "Setup"} · step ${turnRows.length + 1}`;
  document.body.classList.toggle("setup-mode", !!p && p.kind === "setup" && !movesToMake().length);
  if (!p) {
    setHead(turnLabel ? `Turn ${turnLabel.turn}` : "LooNN", "Wait", true);
    ask.replaceChildren(el("div", { class: "thinking" }, el("div", { class: "spinner" }), thinkingText || "Loading…"),
      el("p", {}, "Nothing to do on the table yet."));
    if (view) renderThisTurn(null);
    return;
  }
  promptKind = p.kind;
  const moves = movesToMake();
  if (moves.length) {
    const move = describeMove(moves[0]);
    setHead(stepLabel(), "Do");
    const done = doneButton(() => {
      madeMoves.push(moves[0]);
      turnRows.push(move.row);
      drawCard();
    });
    ask.replaceChildren(...[el("h3", {}, move.title), move.extra, done].filter(Boolean));
    setTimeout(() => done.querySelector("button").focus());
    renderThisTurn(move.title);
    return;
  }
  if (turnFinished()) {
    // The setup's moves lead straight into the first turn
    if (!finishedALoonnTurn()) return startNextTurn();
    setHead(`Turn ${turnLabel ? turnLabel.turn : ""} · end`, "Do");
    const done = doneButton(startNextTurn);
    ask.replaceChildren(el("h3", {}, "LooNN's turn is over. Pass to the next player."),
      el("div", { class: "predicted-box" }, "Predicted final", el("div", {}, $("predicted").textContent, el("small", {}, $("delta").textContent))),
      done);
    setTimeout(() => done.querySelector("button").focus());
    renderThisTurn(null);
    return;
  }
  const body = (PROMPTS[p.kind] || (() => []))(p);
  if (p.kind === "setup") {
    $("setup").replaceChildren(...body);
    return;
  }
  if (p.kind === "turn" && !p.last) {
    turnLabel = roundTurn(view.player.turns_left);
    setHead(`Round ${turnLabel.round} · turn ${turnLabel.turn} of ${ROUND_TURNS[turnLabel.round - 1]}`, "Tell LooNN");
  } else if (p.kind === "over") setHead("End of game", "Final");
  else if (p.kind === "error") setHead("Stopped", "Error");
  else if (p.kind === "turn") setHead("End of game", "Tell LooNN");
  else setHead(stepLabel(), "Tell LooNN");
  const titled = !(p.kind === "turn" && !p.last) && p.kind !== "over";
  ask.replaceChildren(...[
    titled ? el("h3", {}, p.title) : null,
    p.error ? el("p", { class: "error" }, p.error) : null,
    ...body.flat(),
  ].filter(Boolean));
  renderThisTurn(currentRow());
}

function renderPrompt(p, thinking) {
  // A rejected answer doesn't count as a step
  if (p && p.error && toldLast) {
    turnRows.pop();
    if (p.kind === "bird" || p.kind === "bonus") toldCards.pop();
  }
  if (p) toldLast = false;
  shownPrompt = p;
  thinkingText = thinking;
  promptKind = p ? p.kind : null;
  drawCard();
}

async function restart() {
  if (view && view.player && view.status !== "Game over" && !confirm("Abandon this game and start a new one?")) return;
  // After an error the next prompt can have a lower seq, so don't wait for a higher one
  awaiting = promptKind === "error" ? -1 : seq;
  turnStart = null;
  turnLabel = null;
  madeMoves = [];
  toldCards = [];
  turnRows = [];
  renderPrompt(null, "Starting a new game…");
  await backend.restart();
}

function onState(state) {
  if (state.view) {
    const text = JSON.stringify(state.view);
    if (text !== viewText) { viewText = text; view = state.view; renderView(); }
  }
  if (state.seq <= awaiting) return;
  awaiting = -1;
  // A prompt is redrawn only when it changes, so typing isn't lost
  if (!state.prompt) renderPrompt(null);
  else if (state.seq !== seq) renderPrompt(state.prompt);
  seq = state.prompt ? state.seq : -1;
}

function showError(message) {
  awaiting = -1;
  seq = -1;
  renderPrompt({ kind: "error", title: `Something went wrong: ${message}`, error: null });
}

// ---- Running the game ----
// With the local server (cargo run --release --bin play) the game runs there.
// Anywhere else, such as GitHub Pages, it runs in this browser: web/worker.js
// runs the engine compiled to WebAssembly.

function serverBackend() {
  let timer = null;
  async function poll() {
    clearTimeout(timer);
    try {
      onState(await (await fetch("api/state", { cache: "no-store" })).json());
    } catch (e) {
      showError("can't reach the server. Is `cargo run --release --bin play` running?");
    }
    timer = setTimeout(poll, 500);
  }
  return {
    local: false,
    start: poll,
    answer: (seq, lines) => fetch("api/answer", { method: "POST", body: [seq, ...lines].join("\n") }).then(poll),
    restart: () => fetch("api/restart", { method: "POST" }).then(poll),
  };
}

function workerBackend(gotCatalog) {
  let worker = null, crashed = false;
  function spawn() {
    crashed = false;
    worker = new Worker("worker.js", { type: "module" });
    worker.onmessage = ({ data }) => {
      if (data.type === "catalog") gotCatalog(data.catalog);
      else if (data.type === "state") onState(data.state);
      else if (data.type === "error") { crashed = true; showError(data.message); }
    };
    worker.onerror = e => { crashed = true; showError(e.message || "the game failed to load"); };
  }
  return {
    local: true,
    start: spawn,
    answer: (seq, lines) => worker.postMessage({ type: "answer", seq, lines }),
    restart() {
      if (!crashed) return worker.postMessage({ type: "restart" });
      // A crashed WebAssembly game can't be trusted, so start a fresh one
      worker.terminate();
      seq = awaiting = -1;
      spawn();
    },
  };
}

async function connect() {
  try {
    const response = await fetch("api/catalog", { cache: "no-store" });
    if (response.ok && (response.headers.get("content-type") || "").includes("json")) {
      return [serverBackend(), await response.json()];
    }
  } catch { }
  let gotCatalog;
  const catalogLoaded = new Promise(resolve => gotCatalog = resolve);
  const worker = workerBackend(gotCatalog);
  worker.start();
  return [worker, await catalogLoaded];
}

$("restart").addEventListener("click", restart);

// The lever follows the system's setting until it's used, then remembers the choice
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : systemDark.matches;
const showTheme = () => $("theme").setAttribute("aria-checked", String(isDark()));
$("theme").addEventListener("click", () => {
  const theme = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("loonn-theme", theme); } catch { }
  showTheme();
});
systemDark.addEventListener("change", showTheme);
showTheme();

// The browser-run game lives in this tab only
addEventListener("beforeunload", e => {
  if (backend && backend.local && view && view.player && view.status !== "Game over") e.preventDefault();
});
(async () => {
  renderPrompt(null, "Loading LooNN…");
  let catalogJson;
  [backend, catalogJson] = await connect();
  catalog = catalogJson;
  if (!backend.local) backend.start();
})();
</script>
</body>
</html>
